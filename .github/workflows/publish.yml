name: Publish to npm
# Runs only when a maintainer publishes a GitHub release or starts it by hand.
# Requires an NPM_TOKEN repository secret (an npm automation token), or npm trusted
# publishing configured for this repository on npmjs.com.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance: links the published package to this exact commit and workflow
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: test -z "$(git status --porcelain -- plugin/)" || (git status --short -- plugin/; exit 1)
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
